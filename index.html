<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">

    <meta name="description" content="Michael Lesirge's Programming Project List">
    <meta name="keywords" content="michaellesirge, projects, code, programming, software, list, homepage, ">

    <meta name="google-site-verification" content="pp7j9nC0xEdzF89O_kBBLxeVQtlOH3k_ipb_gw2wJKU" />

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }

        h1 {
            margin: 0;
        }

        button {
            cursor: pointer;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 1rem;
        }

        .warning {
            font-size: 0.6rem;
            color: red;
        }

        .github-info {
            display: flex;
            justify-content: center;
            gap: 1px;

            border-bottom: 1px solid black;

            text-decoration: none;
        }

        .projects {
            display: flex;
            flex-wrap: wrap;
            width: 100%;
            justify-content: space-evenly;
            gap: 20px;

            outline: 1px solid #ddd;
            padding: 2rem;
        }

        .project {
            position: relative;

            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 5px;
            overflow: hidden;
            width: 19rem;

            text-decoration: none;
            color: black;

            /* transition: transform 0.3s ease-in-out; */
            transition: scale 0.1s ease-in-out;
        }

        .project:hover,
        .project:focus {
            /* transform: translateY(-10px); */
            scale: 1.05;

        }

        .project:active {
            filter: brightness(0.9);
        }

        .project .project-image {
            width: 100%;
            height: 10rem;
            display: block;
            border-bottom: 1px solid #ddd;

        }

        .project .github-logo {
            width: 1em;
            height: 1em;
            display: inline-block;
        }

        .project .info {
            padding: 15px;
        }

        .project .title {
            display: flex;
            justify-content: space-between;
        }

        .project h3 {
            margin-top: 0;
            margin-bottom: 0rem;
            font-size: 1.2em;
            /* text-decoration: underline; */
        }

        .project p {
            margin-bottom: 0;
        }

        #github-foot {
            display: none;
        }

        @media screen and (max-width: 700px) {
            #github-head {
                display: none;
            }

            #github-foot {
                display: unset;
            }
        }

        footer {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;

            margin-top: 1rem;
            gap: 1rem;

            width: 100%;
        }

        .inline-image {
            display: inline-block;
            height: 1.3rem;
        }

        .section-title {
            margin-top: 2rem;
            margin-bottom: 0rem;
        }
    </style>

</head>

<body>
